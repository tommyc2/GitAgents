---
project:
  name: "gitagents"
  description: "Multi-agent AI code & dependency review GitHub Action"

global_config:
  language: "en"

model:
  provider: "anthropic"
  name: "claude-sonnet-4-6"
  max_tokens: 4096
  temperature: 0.2

code_review:
  tone: "concise"  # "constructive", "strict", "concise", "educational"
  focus:
    - "correctness"
    - "security"
  ignore_patterns:
    - "*.min.js"
    - "dist/**"
    - "docs/DEPLOYMENT.md"

dependency_review:
  enabled: true
  manifest_files:
    - "package-lock.json"
    - "package.json"
  risk_tolerance: "medium"  # "low", "medium", "high"

feedback:
  enabled: true
  model:
    provider: "anthropic"
    name: "claude-sonnet-4-6"
    max_tokens: 4096
    temperature: 0.1
