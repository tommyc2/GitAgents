name: 'GitAgents'
description: 'Multi-agent AI code & dependency review for pull requests'
author: 'tommyc2'
branding:
  icon: 'git-pull-request'
  color: 'purple'
inputs:
  github-token:
    description: 'Token used to read PR files and post the review'
    required: false
    default: ${{ github.token }}
  config-path:
    description: 'Path to agents.config.yaml in the checked-out repo'
    required: false
    default: 'agents.config.yaml'
  instructions-path:
    description: 'Path to the reviewer-instructions markdown file on the default branch'
    required: false
    default: 'AI_PR_REVIEWER.md'
runs:
  using: 'node20'
  main: 'dist/action/index.js'
